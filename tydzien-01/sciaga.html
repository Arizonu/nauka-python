<title>Ściąga z Pythona, tydzień 1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: jeden temat na ekran, jak karta w zeszycie. Duży tekst, jedno zdanie, jeden przykład,
   jedna pułapka. Na dole stały pasek Wstecz / Dalej. Na końcu mini-quiz, też po jednym pytaniu. */
:root{
  --paper:#eef2f4; --card:#ffffff; --ink:#14212b; --muted:#5a6b78; --line:#d3dce2;
  --accent:#0a6e78; --accent-soft:#d6ecee; --mark:#e9b92f; --mark-soft:#fbf0c7;
  --bad:#b3261e; --bad-soft:#f8dedb; --good:#1e7a46; --good-soft:#dcefe3;
  --code:#16222b; --code-fg:#e6edf2; --c-str:#9fdc96; --c-num:#f5c66b; --c-fn:#7fd3dc; --c-com:#8a9ba7;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f171d; --card:#16212a; --ink:#e3eaef; --muted:#9aabb8; --line:#2a3843;
  --accent:#4fc1c9; --accent-soft:#12343a; --mark:#f2c84b; --mark-soft:#3a3214;
  --bad:#ff8a80; --bad-soft:#3d1d1b; --good:#6fd49a; --good-soft:#173325; --code:#0a1116; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f171d; --card:#16212a; --ink:#e3eaef; --muted:#9aabb8; --line:#2a3843;
  --accent:#4fc1c9; --accent-soft:#12343a; --mark:#f2c84b; --mark-soft:#3a3214;
  --bad:#ff8a80; --bad-soft:#3d1d1b; --good:#6fd49a; --good-soft:#173325; --code:#0a1116; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:19px/1.55 var(--body)}
.wrap{max-width:640px;margin:0 auto;padding-block:20px 120px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:var(--display);text-wrap:balance;line-height:1.15;margin:0}
h1{font-size:1.15rem;font-weight:800;color:var(--accent)}
h2{font-size:clamp(1.8rem,6vw,2.3rem);font-weight:800;letter-spacing:-.01em}
p{margin:0}
code{font-family:var(--mono);font-size:.9em;background:var(--accent-soft);padding:.05em .35em;border-radius:5px}
:focus-visible{outline:3px solid var(--mark);outline-offset:2px}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.count{font:600 .85rem var(--mono);color:var(--muted)}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);background:var(--card);color:var(--muted);font:600 .75rem var(--mono);cursor:pointer;display:grid;place-items:center;padding:0}
.dot.done{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.dot.now{background:var(--accent);border-color:var(--accent);color:var(--card)}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px clamp(18px,5vw,30px);display:flex;flex-direction:column;gap:18px}
.one{font-size:1.2rem}
.one b{background:linear-gradient(transparent 58%,var(--mark-soft) 58%)}
.pic{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;padding:16px;background:var(--paper);border-radius:14px;font:600 1rem var(--mono)}
.box{border:2px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--card)}
.box.ok{border-color:var(--good)} .box.no{border-color:var(--bad)}
.tagname{background:var(--accent);color:var(--card);border-radius:999px;padding:8px 16px}
.arrow{color:var(--accent);font-size:1.3rem}
.hole{background:var(--mark-soft);padding:2px 4px;border-radius:4px}
.lab{font:600 .7rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
pre{margin:0;background:var(--code);color:var(--code-fg);border-radius:12px;padding:14px 16px;font:16px/1.6 var(--mono);overflow-x:auto}
.out{border:2px dashed var(--line);border-radius:12px;padding:10px 16px;font:600 16px/1.6 var(--mono);white-space:pre;overflow-x:auto}
.t-s{color:var(--c-str)} .t-n{color:var(--c-num)} .t-f{color:var(--c-fn)} .t-c{color:var(--c-com);font-style:italic}
.trap{background:var(--bad-soft);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.trap strong{color:var(--bad);font:700 .75rem var(--mono);letter-spacing:.1em;text-transform:uppercase}
.trap .ok{color:var(--good);font-weight:700}
.remember{background:var(--mark-soft);border-radius:12px;padding:14px 16px;font-weight:700}
.remember::before{content:"Zapamiętaj: ";color:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid1{display:grid;gap:10px}
.chip{border-radius:12px;padding:12px;background:var(--paper);display:flex;flex-direction:column;gap:2px;min-width:0}
.chip b{font:700 1.05rem var(--mono);color:var(--accent);overflow-wrap:anywhere}
.chip span{font:500 .95rem var(--mono)}
.chip small{color:var(--muted);font-size:.85rem;line-height:1.3}

/* quiz */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{font:600 1.05rem var(--mono);text-align:left;padding:14px 16px;min-height:52px;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.opt.right{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.explain{background:var(--paper);border-radius:12px;padding:12px 16px}
.big{font:800 3rem var(--display);color:var(--accent);text-align:center}

/* dolny pasek */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav-in{max-width:640px;margin:0 auto;display:flex;gap:10px}
.btn{flex:1;font:700 1.05rem var(--body);border-radius:999px;padding:14px 18px;min-height:52px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--card)}
.btn:disabled{opacity:.35;cursor:default}
</style>

<div class="wrap">
  <div class="top"><h1>Python · tydzień 1</h1><span class="count" id="count"></span></div>
  <div class="dots" id="dots" aria-label="Tematy"></div>
  <main id="screen"></main>
</div>
<nav class="nav"><div class="nav-in">
  <button class="btn" id="prev" type="button">← Wstecz</button>
  <button class="btn primary" id="next" type="button">Dalej →</button>
</div></nav>

<template id="t0">
  <section class="card">
    <h2>print()</h2>
    <p class="one"><b>print()</b> pokazuje coś na ekranie.</p>
    <div class="pic"><span class="tagname">print</span><span class="arrow">+</span><span class="box">( )</span><span class="arrow">=</span><span class="box">uruchom!</span></div>
    <div><div class="lab">kod</div><pre class="py">print("Hej", "Kacper")</pre></div>
    <div><div class="lab">wynik</div><div class="out">Hej Kacper</div></div>
    <div class="trap"><strong>Pułapka</strong><p>Bez nawiasów nic się nie stanie. Nawiasy znaczą „zrób to teraz”.</p></div>
    <p class="remember">nazwa + nawiasy = działa.</p>
  </section>
</template>

<template id="t1">
  <section class="card">
    <h2>Zmienna</h2>
    <p class="one">Zmienna to <b>pudełko z nazwą</b>. Znak <code>=</code> wkłada coś do pudełka.</p>
    <div class="pic"><span class="tagname">wiek</span><span class="arrow">→</span><span class="box">20</span></div>
    <div><div class="lab">kod</div><pre class="py">wiek = 20
print(wiek)</pre></div>
    <div><div class="lab">wynik</div><div class="out">20</div></div>
    <div class="trap"><strong>Pułapka</strong><p>Nowe <code>=</code> wyrzuca starą wartość. Po <code>wiek = 21</code> w pudełku jest już tylko 21.</p></div>
    <p class="remember">nazwa po lewej, wartość po prawej.</p>
  </section>
</template>

<template id="t2">
  <section class="card">
    <h2>Typy</h2>
    <p class="one">Każda wartość ma <b>rodzaj</b>. Sprawdzisz go przez <code>type()</code>.</p>
    <div class="grid2">
      <div class="chip"><b>int</b><span>20</span><small>liczba całkowita</small></div>
      <div class="chip"><b>float</b><span>0.342</span><small>liczba z kropką</small></div>
      <div class="chip"><b>str</b><span>"Kacper"</span><small>tekst w cudzysłowie</small></div>
      <div class="chip"><b>bool</b><span>True</span><small>prawda / fałsz</small></div>
    </div>
    <div class="trap"><strong>Pułapka</strong><p><code>20</code> to liczba, a <code>"20"</code> to tekst. Cudzysłów zawsze robi tekst.</p></div>
    <p class="remember">cudzysłów = tekst.</p>
  </section>
</template>

<template id="t3">
  <section class="card">
    <h2>Kropka, nie przecinek</h2>
    <p class="one">W Pythonie ułamki piszesz <b>z kropką</b>, jak po angielsku.</p>
    <div class="pic"><span class="box ok">0.342 ✓</span><span class="box no">0,342 ✗</span></div>
    <div><div class="lab">kod z błędem</div><pre class="py">czas = 0,342
print(czas)</pre></div>
    <div><div class="lab">wynik</div><div class="out">(0, 342)</div></div>
    <div class="trap"><strong>Pułapka</strong><p>Przecinek rozdziela rzeczy. Python widzi dwie liczby: 0 i 342.</p></div>
    <p class="remember">0.342, zawsze kropka.</p>
  </section>
</template>

<template id="t4">
  <section class="card">
    <h2>Liczenie i średnia</h2>
    <p class="one">Python liczy jak kalkulator: <code>+ - * /</code>. <b>Mnożenie i dzielenie idą przed dodawaniem.</b></p>
    <div class="pic"><span class="box">(300 + 400)</span><span class="arrow">/ 2 =</span><span class="box ok">350.0</span></div>
    <div><div class="lab">średnia: suma w nawiasie, potem dzielenie</div><pre class="py">srednia = (proba1 + proba2 + proba3) / 3</pre></div>
    <div class="trap"><strong>Pułapka</strong><p>Bez nawiasu <code>300 + 400 / 2</code> daje <b>500.0</b>, bo najpierw dzieli. Python nie pokaże błędu, po prostu źle policzy.</p></div>
    <p class="remember">przy średniej zawsze nawias.</p>
  </section>
</template>

<template id="t5">
  <section class="card">
    <h2>round, min, max</h2>
    <p class="one">Trzy <b>pomocnicze funkcje</b> do liczb.</p>
    <div class="grid1">
      <div class="chip"><b>round(0.3958, 2)</b><span>→ 0.4</span><small>zaokrągla do 2 miejsc po kropce</small></div>
      <div class="chip"><b>min(342, 298, 512)</b><span>→ 298</span><small>najmniejsza liczba (najszybsza próba)</small></div>
      <div class="chip"><b>max(342, 298, 512)</b><span>→ 512</span><small>największa liczba (najwolniejsza próba)</small></div>
    </div>
    <div class="trap"><strong>Pułapka</strong><p>W nawiasie liczby oddzielasz <b>przecinkami</b>. Tu przecinek jest dobry, bo rozdziela liczby.</p></div>
    <p class="remember">round = zaokrągla, min = najmniej, max = najwięcej.</p>
  </section>
</template>

<template id="t6">
  <section class="card">
    <h2>f-string</h2>
    <p class="one">Literka <code>f</code> przed tekstem pozwala wstawić zmienną w <b>klamry { }</b>.</p>
    <div class="pic"><span class="tagname">f</span><span class="box">"Mam <span class="hole">{wiek}</span> lat"</span><span class="arrow">→</span><span class="box">Mam 20 lat</span></div>
    <div><div class="lab">kod</div><pre class="py">wiek = 20
print(f"Mam {wiek} lat")</pre></div>
    <div><div class="lab">wynik</div><div class="out">Mam 20 lat</div></div>
    <div class="trap"><strong>Pułapka</strong><p>Bez <code>f</code> wypisze dosłownie <code>Mam {wiek} lat</code>.</p><p>Bonus: <code>{x:.0f}</code> pokazuje liczbę bez miejsc po kropce.</p></div>
    <p class="remember">f"tekst {zmienna}".</p>
  </section>
</template>

<template id="t7">
  <section class="card">
    <h2>Gdy coś się psuje</h2>
    <p class="one">Czytaj <b>ostatnią linijkę</b> błędu. Najczęstsze trzy:</p>
    <div class="trap"><strong>not callable</strong><p>Nadpisałeś funkcję, np. <code>print = "Hej"</code> albo <code>round = 0.5</code>.</p><p class="ok">Zrestartuj sesję w Colabie i usuń tę linię.</p></div>
    <div class="trap"><strong>NameError</strong><p>Literówka w nazwie albo nie uruchomiłeś komórki wyżej.</p><p class="ok">Sprawdź pisownię, uruchom komórki od góry.</p></div>
    <div class="trap"><strong>SyntaxError</strong><p>Brakuje nawiasu <code>)</code> albo cudzysłowu <code>"</code>.</p><p class="ok">Policz pary: co otwarte, musi być zamknięte.</p></div>
    <p class="remember">błąd to wskazówka, nie porażka.</p>
  </section>
</template>

<script>
const TOPICS=8;
const QUIZ=[
  {q:'print("Ala", 5)',opts:["Ala 5","Ala5","błąd"],a:0,why:"Przecinek w print daje spację."},
  {q:'x = 3\nx = 7\nprint(x)',opts:["3","7","10"],a:1,why:"Nowe = wyrzuca starą wartość."},
  {q:'print(type("20"))',opts:["<class 'int'>","<class 'str'>","<class 'float'>"],a:1,why:"Cudzysłów = tekst (str)."},
  {q:'print(100 + 200 / 2)',opts:["150.0","200.0","300"],a:1,why:"Najpierw dzielenie: 200 / 2 = 100.0, potem 100 + 100.0."},
  {q:'print(max(4, 9, 2))',opts:["2","9","15"],a:1,why:"max = największa."},
  {q:'print(round(2.678, 1))',opts:["2.6","2.7","3"],a:1,why:"1 miejsce po kropce, a 7 zaokrągla w górę."},
  {q:'imie = "Ola"\nprint(f"Hej {imie}")',opts:["Hej {imie}","Hej Ola","Hej imie"],a:1,why:"Z literą f klamry wstawiają wartość."},
  {q:'t = 0,5\nprint(t)',opts:["0.5","(0, 5)","5"],a:1,why:"Przecinek rozdziela, więc są dwie liczby."}
];
const TOTAL=TOPICS+QUIZ.length+1;
let i=0, answers={};
try{const s=JSON.parse(localStorage.getItem("sciaga-t1-krok")||"null");if(s&&typeof s.i==="number"&&s.i>=0&&s.i<TOPICS)i=s.i}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const re=/(#[^\n]*)|(f?"[^"\n]*")|\b(print|round|min|max|type)\b(?=\()|\b(\d+\.?\d*)\b/g;
function color(el){const src=el.textContent;let out="",last=0,m;re.lastIndex=0;
  while((m=re.exec(src))){out+=esc(src.slice(last,m.index));const c=m[1]?"t-c":m[2]?"t-s":m[3]?"t-f":"t-n";out+=`<span class="${c}">${esc(m[0])}</span>`;last=re.lastIndex}
  el.innerHTML=out+esc(src.slice(last));}

function dots(){
  const d=$("dots");d.innerHTML="";
  const add=(label,k,cls,aria)=>{const b=document.createElement("button");b.type="button";b.className="dot"+cls;b.textContent=label;b.setAttribute("aria-label",aria);b.onclick=()=>go(k);d.append(b)};
  for(let k=0;k<TOPICS;k++)add(k+1,k,k===i?" now":k<i?" done":"","Temat "+(k+1));
  add("?",TOPICS,i>=TOPICS?" now":"","Quiz");
}
function render(){
  const s=$("screen");s.innerHTML="";
  if(i<TOPICS){
    s.append($("t"+i).content.cloneNode(true));
    $("count").textContent=`Temat ${i+1} z ${TOPICS}`;
  }else if(i<TOPICS+QUIZ.length){
    const n=i-TOPICS,q=QUIZ[n];
    $("count").textContent=`Quiz ${n+1} z ${QUIZ.length}`;
    const c=document.createElement("section");c.className="card";
    c.innerHTML=`<h2>Co wypisze Python?</h2><pre class="py"></pre><div class="opts"></div><div class="explain" hidden></div>`;
    c.querySelector("pre").textContent=q.q;
    const box=c.querySelector(".opts"),ex=c.querySelector(".explain");
    const show=j=>{box.querySelectorAll("button").forEach(b=>{b.disabled=true;const k=+b.dataset.j;if(k===q.a)b.classList.add("right");if(k===j&&j!==q.a)b.classList.add("wrong")});
      ex.hidden=false;ex.innerHTML=`<b>${j===q.a?"Dobrze!":"Prawie."}</b> `;ex.append(q.why)};
    q.opts.forEach((o,j)=>{const b=document.createElement("button");b.type="button";b.className="opt";b.textContent=o;b.dataset.j=j;
      b.onclick=()=>{answers[n]=j;show(j)};box.append(b)});
    s.append(c); if(n in answers)show(answers[n]);
  }else{
    const score=QUIZ.reduce((t,q,n)=>t+(answers[n]===q.a?1:0),0);
    $("count").textContent="Wynik";
    const c=document.createElement("section");c.className="card";
    c.innerHTML=`<h2>Twój wynik</h2><p class="big">${score} / ${QUIZ.length}</p><p class="one">${score===QUIZ.length?"Komplet! Wróć tu za kilka dni i sprawdź, czy dalej pamiętasz.":"Wróć do tematów, w których się pomyliłeś, i spróbuj jeszcze raz."}</p><button class="btn primary" type="button" id="again">Quiz od nowa</button>`;
    s.append(c);$("again").onclick=()=>{answers={};go(TOPICS)};
  }
  s.querySelectorAll("pre.py").forEach(color);
  $("prev").disabled=i===0;
  $("next").textContent=i===TOPICS-1?"Quiz →":i===TOTAL-1?"Od początku":"Dalej →";
  dots();
  try{localStorage.setItem("sciaga-t1-krok",JSON.stringify({i}))}catch(e){}
}
function go(k){i=Math.max(0,Math.min(TOTAL-1,k));render();window.scrollTo({top:0})}
$("prev").onclick=()=>go(i-1);
$("next").onclick=()=>go(i===TOTAL-1?0:i+1);
render();
</script>
